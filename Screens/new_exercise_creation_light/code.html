<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>New Exercise - Strength Training App</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#1978e5",
                        "background-light": "#f6f7f8",
                        "background-dark": "#111821",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 min-h-screen">
<div class="relative flex h-auto min-h-screen w-full flex-col bg-background-light dark:bg-background-dark overflow-x-hidden">
<!-- Top App Bar -->
<header class="flex items-center bg-white dark:bg-slate-900 p-4 border-b border-slate-200 dark:border-slate-800 sticky top-0 z-10">
<button class="text-slate-900 dark:text-slate-100 flex size-10 shrink-0 items-center justify-center rounded-full hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h2 class="text-slate-900 dark:text-slate-100 text-lg font-bold leading-tight tracking-tight flex-1 ml-2">New Exercise</h2>
<button class="text-primary text-base font-bold leading-normal tracking-tight px-4 py-2 hover:bg-primary/10 rounded-lg transition-colors">
                Save
            </button>
</header>
<main class="flex flex-col max-w-2xl mx-auto w-full pb-10">
<!-- Exercise Name Input -->
<section class="flex flex-col gap-4 px-4 py-6">
<label class="flex flex-col w-full">
<p class="text-slate-900 dark:text-slate-100 text-sm font-semibold leading-normal pb-2">Exercise Name</p>
<input class="form-input flex w-full rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 text-slate-900 dark:text-slate-100 focus:border-primary focus:ring-1 focus:ring-primary h-14 placeholder:text-slate-400 p-4 text-base font-normal" placeholder="e.g. Incline Dumbbell Press" type="text"/>
</label>
</section>
<!-- Primary Muscle Groups -->
<section class="px-4 py-4">
<h3 class="text-slate-900 dark:text-slate-100 text-sm font-semibold leading-tight tracking-tight pb-4">Primary Muscle Groups</h3>
<div class="flex gap-2 flex-wrap">
<button class="flex h-10 items-center justify-center rounded-full bg-primary text-white px-4 transition-colors">
<span class="text-sm font-medium">Chest</span>
</button>
<button class="flex h-10 items-center justify-center rounded-full bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-slate-300 px-4 hover:bg-slate-300 dark:hover:bg-slate-700 transition-colors">
<span class="text-sm font-medium">Shoulders</span>
</button>
<button class="flex h-10 items-center justify-center rounded-full bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-slate-300 px-4 hover:bg-slate-300 dark:hover:bg-slate-700 transition-colors">
<span class="text-sm font-medium">Triceps</span>
</button>
<button class="flex h-10 items-center justify-center rounded-full bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-slate-300 px-4 hover:bg-slate-300 dark:hover:bg-slate-700 transition-colors">
<span class="text-sm font-medium">Back</span>
</button>
<button class="flex h-10 items-center justify-center rounded-full bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-slate-300 px-4 hover:bg-slate-300 dark:hover:bg-slate-700 transition-colors">
<span class="text-sm font-medium">Legs</span>
</button>
<button class="flex h-10 items-center justify-center rounded-full bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-slate-300 px-4 hover:bg-slate-300 dark:hover:bg-slate-700 transition-colors">
<span class="text-sm font-medium">Biceps</span>
</button>
<button class="flex h-10 items-center justify-center rounded-full bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-slate-300 px-4 hover:bg-slate-300 dark:hover:bg-slate-700 transition-colors">
<span class="text-sm font-medium">Abs</span>
</button>
</div>
</section>
<!-- Equipment Needed -->
<section class="px-4 py-4">
<h3 class="text-slate-900 dark:text-slate-100 text-sm font-semibold leading-tight tracking-tight pb-4">Equipment Needed</h3>
<div class="grid grid-cols-2 gap-3">
<label class="flex items-center gap-3 p-3 rounded-lg border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 cursor-pointer">
<input checked="" class="form-checkbox rounded text-primary focus:ring-primary h-5 w-5 border-slate-300 dark:border-slate-700 dark:bg-slate-800" type="checkbox"/>
<span class="text-sm text-slate-700 dark:text-slate-300">Dumbbells</span>
</label>
<label class="flex items-center gap-3 p-3 rounded-lg border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 cursor-pointer">
<input checked="" class="form-checkbox rounded text-primary focus:ring-primary h-5 w-5 border-slate-300 dark:border-slate-700 dark:bg-slate-800" type="checkbox"/>
<span class="text-sm text-slate-700 dark:text-slate-300">Bench</span>
</label>
<label class="flex items-center gap-3 p-3 rounded-lg border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 cursor-pointer">
<input class="form-checkbox rounded text-primary focus:ring-primary h-5 w-5 border-slate-300 dark:border-slate-700 dark:bg-slate-800" type="checkbox"/>
<span class="text-sm text-slate-700 dark:text-slate-300">Barbell</span>
</label>
<label class="flex items-center gap-3 p-3 rounded-lg border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 cursor-pointer">
<input class="form-checkbox rounded text-primary focus:ring-primary h-5 w-5 border-slate-300 dark:border-slate-700 dark:bg-slate-800" type="checkbox"/>
<span class="text-sm text-slate-700 dark:text-slate-300">Cable Machine</span>
</label>
</div>
</section>
<!-- Media Section -->
<section class="px-4 py-4">
<h3 class="text-slate-900 dark:text-slate-100 text-sm font-semibold leading-tight tracking-tight pb-4">Media</h3>
<div class="flex gap-4">
<div class="relative w-32 h-32 rounded-xl bg-slate-200 dark:bg-slate-800 flex flex-col items-center justify-center border-2 border-dashed border-slate-300 dark:border-slate-700 group hover:border-primary transition-colors cursor-pointer">
<span class="material-symbols-outlined text-slate-400 group-hover:text-primary">add_a_photo</span>
<span class="text-[10px] font-medium text-slate-500 mt-2">Add Photo</span>
</div>
<div class="relative w-32 h-32 rounded-xl bg-slate-200 dark:bg-slate-800 flex flex-col items-center justify-center border-2 border-dashed border-slate-300 dark:border-slate-700 group hover:border-primary transition-colors cursor-pointer">
<span class="material-symbols-outlined text-slate-400 group-hover:text-primary">videocam</span>
<span class="text-[10px] font-medium text-slate-500 mt-2">Add Video</span>
</div>
<div class="relative w-32 h-32 rounded-xl overflow-hidden border border-slate-200 dark:border-slate-800">
<img alt="Workout preview" class="w-full h-full object-cover" data-alt="Close up of gym equipment and weights" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDExpNrFAVDpwDb6ARRK9hzEngmgWsL8uqPE0iUhCfAQOwGWpGDwugwNP4iImho8l8bFHa-E1WVkbztcHptuf4PDjMEeit4C5GwOzCPRUTrKnbvEXIGbmYEuGrhoTFOqLDm1bwqN97twAxobS4gOjirp8mI_VX-SCdyyZ82_ypDn11UnBkhuFMUfrvJRhs4aN3iC4ZJsnG8T32wbzHe-s5pcDV2eepIbToeGw7_NZzMDTV99BziduD3IIC_bJ4qYPyvSsbYodM8dA4"/>
<button class="absolute top-1 right-1 bg-black/50 text-white rounded-full p-1">
<span class="material-symbols-outlined text-sm">close</span>
</button>
</div>
</div>
</section>
<!-- Instructions Text Area -->
<section class="flex flex-col gap-4 px-4 py-4">
<label class="flex flex-col w-full">
<p class="text-slate-900 dark:text-slate-100 text-sm font-semibold leading-normal pb-2">Instructions &amp; Form Tips</p>
<textarea class="form-textarea flex w-full rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 text-slate-900 dark:text-slate-100 focus:border-primary focus:ring-1 focus:ring-primary min-h-[160px] placeholder:text-slate-400 p-4 text-base font-normal leading-relaxed" placeholder="Describe the proper form, setup, and key tips for this exercise..."></textarea>
</label>
</section>
<!-- Advanced Settings (Optional Toggle Style) -->
<section class="px-4 py-4 mb-10">
<div class="flex items-center justify-between p-4 bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800">
<div class="flex flex-col">
<span class="text-sm font-semibold text-slate-900 dark:text-slate-100">Set as Variation</span>
<span class="text-xs text-slate-500">Group this with similar exercises</span>
</div>
<button class="w-12 h-6 bg-slate-200 dark:bg-slate-700 rounded-full relative transition-colors">
<div class="absolute left-1 top-1 bg-white w-4 h-4 rounded-full shadow-sm"></div>
</button>
</div>
</section>
</main>
<!-- Bottom Navigation Spacer (Mobile) -->
<div class="h-16 md:hidden"></div>
</div>
</body></html>
