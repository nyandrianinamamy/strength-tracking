<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Create Routine - Strength Training App</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#257bf4",
                        "background-light": "#f8fafd",
                        "background-dark": "#0a121e",
                    },
                    fontFamily: {
                        "display": ["Lexend"]
                    },
                    borderRadius: {"DEFAULT": "0.5rem", "lg": "0.75rem", "xl": "1rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        body {
            min-height: max(884px, 100dvh);
            font-family: 'Lexend', sans-serif;
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 min-h-screen">
<div class="max-w-md mx-auto bg-background-light dark:bg-background-dark min-h-screen shadow-xl">
<header class="flex items-center justify-between p-4 sticky top-0 bg-white/80 dark:bg-background-dark/80 backdrop-blur-md z-10 border-b border-slate-200 dark:border-white/10">
<button class="flex items-center justify-center w-10 h-10 rounded-full hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
<span class="material-symbols-outlined text-slate-700 dark:text-slate-300">arrow_back</span>
</button>
<h1 class="text-lg font-bold tracking-tight">New Routine</h1>
<button class="bg-primary hover:brightness-110 text-white px-5 py-2 rounded-full font-bold text-sm transition-all shadow-sm">
                Save
            </button>
</header>
<main class="p-4 space-y-6">
<section class="space-y-2">
<label class="text-sm font-semibold text-slate-500 dark:text-slate-400 ml-1" for="routine-name">Routine Name</label>
<input class="w-full bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl px-4 py-3 focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all text-lg font-medium placeholder:text-slate-400" id="routine-name" placeholder="e.g. Morning Full Body" type="text"/>
</section>
<section class="space-y-4">
<div class="flex items-center justify-between">
<h2 class="text-lg font-bold">Exercises</h2>
<button class="flex items-center gap-1 text-primary font-bold text-sm hover:underline">
<span class="material-symbols-outlined text-lg">add_circle</span>
                        Add Exercise
                    </button>
</div>
<div class="space-y-3">
<div class="bg-white dark:bg-slate-900 p-4 rounded-xl border border-slate-200 dark:border-slate-800 shadow-sm relative">
<div class="flex gap-3">
<div class="w-14 h-14 shrink-0 rounded-lg bg-slate-100 dark:bg-slate-800 flex items-center justify-center overflow-hidden">
<img class="object-cover w-full h-full" data-alt="Person performing barbell bench press exercise" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDG-Bfvq5DNpd3Ze021qJrPKL_CPknKa8Qh3Dm3bp1S48Y8I3POiJ3n6l_ww0tJqJP-6nUZzeMK1rJdjg5iY04R-c_E9jBcCclUngG-IwGYZe9zyEaLhfuByTizKU9ZbP5QtFEXJ2CUWgipN4PMjGfU8EKtUu73auG0yZlULnusSdbzIUgwaQasQ38Z7kYTgdHzN0fGk_9yB0jCkVXhnoxLQKvIxTvfP5Cnvkpu9_lo6ZsJ5wCMQxR2EKg2kcdefWdHRDNID7MALro"/>
</div>
<div class="flex-1 min-w-0">
<div class="flex justify-between items-start">
<div>
<h3 class="font-bold text-slate-900 dark:text-slate-100 truncate">Barbell Bench Press</h3>
<p class="text-[10px] text-slate-400 dark:text-primary/60 uppercase tracking-wider font-bold">Chest, Triceps</p>
</div>
<button class="text-slate-300 hover:text-red-500 transition-colors">
<span class="material-symbols-outlined text-xl">delete</span>
</button>
</div>
<div class="mt-3 flex items-center justify-between">
<div class="flex flex-col items-center">
<span class="text-[10px] uppercase font-bold text-slate-400 mb-1">Sets</span>
<div class="flex items-center gap-1">
<button class="w-6 h-6 flex items-center justify-center rounded-full bg-slate-50 dark:bg-slate-800 text-slate-600 dark:text-slate-400 border border-slate-200 dark:border-slate-700">
<span class="material-symbols-outlined text-sm">remove</span>
</button>
<span class="font-bold text-sm w-5 text-center">3</span>
<button class="w-6 h-6 flex items-center justify-center rounded-full bg-slate-50 dark:bg-slate-800 text-slate-600 dark:text-slate-400 border border-slate-200 dark:border-slate-700">
<span class="material-symbols-outlined text-sm">add</span>
</button>
</div>
</div>
<div class="flex flex-col items-center">
<span class="text-[10px] uppercase font-bold text-slate-400 mb-1">Reps</span>
<div class="flex items-center gap-1">
<button class="w-6 h-6 flex items-center justify-center rounded-full bg-slate-50 dark:bg-slate-800 text-slate-600 dark:text-slate-400 border border-slate-200 dark:border-slate-700">
<span class="material-symbols-outlined text-sm">remove</span>
</button>
<span class="font-bold text-sm w-5 text-center">12</span>
<button class="w-6 h-6 flex items-center justify-center rounded-full bg-slate-50 dark:bg-slate-800 text-slate-600 dark:text-slate-400 border border-slate-200 dark:border-slate-700">
<span class="material-symbols-outlined text-sm">add</span>
</button>
</div>
</div>
<div class="flex flex-col items-center">
<span class="text-[10px] uppercase font-bold text-slate-400 mb-1">Rest</span>
<div class="flex items-center gap-1">
<button class="w-6 h-6 flex items-center justify-center rounded-full bg-slate-50 dark:bg-slate-800 text-slate-600 dark:text-slate-400 border border-slate-200 dark:border-slate-700">
<span class="material-symbols-outlined text-sm">remove</span>
</button>
<span class="font-bold text-sm w-8 text-center">90s</span>
<button class="w-6 h-6 flex items-center justify-center rounded-full bg-slate-50 dark:bg-slate-800 text-slate-600 dark:text-slate-400 border border-slate-200 dark:border-slate-700">
<span class="material-symbols-outlined text-sm">add</span>
</button>
</div>
</div>
</div>
</div>
</div>
</div>
<div class="bg-white dark:bg-slate-900 p-4 rounded-xl border border-slate-200 dark:border-slate-800 shadow-sm relative">
<div class="flex gap-3">
<div class="w-14 h-14 shrink-0 rounded-lg bg-slate-100 dark:bg-slate-800 flex items-center justify-center overflow-hidden">
<img class="object-cover w-full h-full" data-alt="Close up of gym equipment weights" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCTMxS90hUWOlpX2uUvHXn-z-QdeaX2_3IW4E6TBqUIAy5FE12N3o8T74W7JPrGitFzcYgWAHjUMx7vNPJzj3deRnHqFa-_QQHZwMgFJZN7fIlrSKR4FhCZh2FPeVyXUyXsY9MYfhAbLb7wijMEksEoEu2H1xwpS414rvzyvJXp-xoKezD8rPmzSV9OzTvFbGDk05TKDQ1DnRUqw9BhhHaNThFkLUNGj6nX3KlZd3Z6eaNnG_xaY8-e5C0Tj0WM2UlBK2jQmGOBoys"/>
</div>
<div class="flex-1 min-w-0">
<div class="flex justify-between items-start">
<div>
<h3 class="font-bold text-slate-900 dark:text-slate-100 truncate">Weighted Squats</h3>
<p class="text-[10px] text-slate-400 dark:text-primary/60 uppercase tracking-wider font-bold">Quads, Glutes</p>
</div>
<button class="text-slate-300 hover:text-red-500 transition-colors">
<span class="material-symbols-outlined text-xl">delete</span>
</button>
</div>
<div class="mt-3 flex items-center justify-between">
<div class="flex flex-col items-center">
<span class="text-[10px] uppercase font-bold text-slate-400 mb-1">Sets</span>
<div class="flex items-center gap-1">
<button class="w-6 h-6 flex items-center justify-center rounded-full bg-slate-50 dark:bg-slate-800 text-slate-600 dark:text-slate-400 border border-slate-200 dark:border-slate-700">
<span class="material-symbols-outlined text-sm">remove</span>
</button>
<span class="font-bold text-sm w-5 text-center">4</span>
<button class="w-6 h-6 flex items-center justify-center rounded-full bg-slate-50 dark:bg-slate-800 text-slate-600 dark:text-slate-400 border border-slate-200 dark:border-slate-700">

</button>

</div>

<span class="material-symbols-outlined text-sm">remove</span>
</button>
<span class="font-bold text-sm w-5 text-center">8</span>
<button class="w-6 h-6 flex items-center justify-center rounded-full bg-slate-50 dark:bg-slate-800 text-slate-600 dark:text-slate-400 border border-slate-200 dark:border-slate-700">
<span class="material-symbols-outlined text-sm">add</span>
</button>
</div>
</div>
<div class="flex flex-col items-center">
<span class="text-[10px] uppercase font-bold text-slate-400 mb-1">Rest</span>
<div class="flex items-center gap-1">
<button class="w-6 h-6 flex items-center justify-center rounded-full bg-slate-50 dark:bg-slate-800 text-slate-600 dark:text-slate-400 border border-slate-200 dark:border-slate-700">
<span class="material-symbols-outlined text-sm">remove</span>
</button>
<span class="font-bold text-sm w-8 text-center">60s</span>
<button class="w-6 h-6 flex items-center justify-center rounded-full bg-slate-50 dark:bg-slate-800 text-slate-600 dark:text-slate-400 border border-slate-200 dark:border-slate-700">
<span class="material-symbols-outlined text-sm">add</span>
</button>
</div>
</div>
</div>
</div>
</div>
</div>
<button class="w-full border-2 border-dashed border-slate-200 dark:border-slate-800 rounded-xl p-6 flex flex-col items-center justify-center gap-2 text-slate-400 hover:text-primary hover:border-primary/50 transition-all bg-white/50 dark:bg-transparent group">
<span class="material-symbols-outlined text-3xl group-hover:scale-110 transition-transform">add_circle</span>
<span class="font-semibold">Tap to add more exercises</span>
</button>
</div>
</section>
<section class="space-y-4 pt-4">
<div class="flex flex-col gap-2">
<div class="flex items-center gap-2 text-slate-500 dark:text-slate-400 text-sm font-medium">
<span class="material-symbols-outlined text-lg text-primary">schedule</span>
<span>Estimated duration: 45 minutes</span>
</div>
<div class="flex items-center gap-2 text-slate-500 dark:text-slate-400 text-sm font-medium">
<span class="material-symbols-outlined text-lg text-primary">fitness_center</span>
<span>Total volume: ~2,400 kg</span>
</div>
</div>
</section>
</main>
<footer class="p-6 mt-4">
<button class="w-full py-4 bg-primary text-white font-bold rounded-xl shadow-lg shadow-primary/20 hover:brightness-110 hover:-translate-y-0.5 transition-all flex items-center justify-center gap-2">
<span class="material-symbols-outlined">add_task</span>
                Create Routine
            </button>
</footer>
</div>
</body></html>
