<!DOCTYPE html><html lang="en"><head>

  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Strength Training Tracker is an installable offline-first workout journal for routines, live logging, and progress analytics.">
  <meta name="theme-color" content="#257BF4">
  <meta name="application-name" content="Strength Training Tracker">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Strength Tracker">

  <meta name="mobile-web-app-capable" content="yes">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">

  <title>Strength Training Tracker</title>
  <style id="splash-screen-style">
    html {
      height: 100%
    }

    body {
      margin: 0;
      min-height: 100%;
      background-color: #257BF4;
          background-size: 100% 100%;
    }

    .center {
      margin: 0;
      position: absolute;
      top: 50%;
      left: 50%;
      -ms-transform: translate(-50%, -50%);
      transform: translate(-50%, -50%);
    }

    .contain {
      display:block;
      width:100%; height:100%;
      object-fit: contain;
    }

    .stretch {
      display:block;
      width:100%; height:100%;
    }

    .cover {
      display:block;
      width:100%; height:100%;
      object-fit: cover;
    }

    .bottom {
      position: absolute;
      bottom: 0;
      left: 50%;
      -ms-transform: translate(-50%, 0);
      transform: translate(-50%, 0);
    }

    .bottomLeft {
      position: absolute;
      bottom: 0;
      left: 0;
    }

    .bottomRight {
      position: absolute;
      bottom: 0;
      right: 0;
    }
  </style>
  <script id="splash-screen-script">
    function removeSplashFromWeb() {
      document.getElementById("splash")?.remove();
      document.getElementById("splash-branding")?.remove();
      document.body.style.background = "transparent";
    }
  </script>
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
</head>
<body>
  <div id="loading" style="background:#F8FAFD;height:100vh;display:flex;flex-direction:column">
    <div style="max-width:600px;width:100%;margin:0 auto;padding:20px;flex:1">
      <!-- Profile header skeleton -->
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:24px">
        <div class="sk" style="width:48px;height:48px;border-radius:50%"></div>
        <div style="flex:1">
          <div class="sk" style="width:100px;height:12px;border-radius:6px;margin-bottom:8px"></div>
          <div class="sk" style="width:60px;height:18px;border-radius:6px"></div>
        </div>
        <div class="sk" style="width:36px;height:36px;border-radius:50%"></div>
      </div>
      <!-- Stats cards skeleton -->
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:28px">
        <div class="sk-card">
          <div class="sk" style="width:24px;height:24px;border-radius:6px;margin-bottom:12px"></div>
          <div class="sk" style="width:80px;height:10px;border-radius:4px;margin-bottom:8px"></div>
          <div class="sk" style="width:40px;height:28px;border-radius:6px;margin-bottom:12px"></div>
          <div style="flex:1"></div>
          <div class="sk" style="width:50px;height:22px;border-radius:6px"></div>
        </div>
        <div class="sk-card">
          <div class="sk" style="width:24px;height:24px;border-radius:6px;margin-bottom:12px"></div>
          <div class="sk" style="width:70px;height:10px;border-radius:4px;margin-bottom:8px"></div>
          <div class="sk" style="width:30px;height:28px;border-radius:6px;margin-bottom:12px"></div>
          <div style="flex:1"></div>
          <div class="sk" style="width:42px;height:22px;border-radius:11px"></div>
        </div>
      </div>
      <!-- Section title skeleton -->
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px">
        <div style="width:4px;height:24px;border-radius:99px;background:#257BF4;opacity:0.3"></div>
        <div class="sk" style="width:130px;height:20px;border-radius:6px"></div>
      </div>
      <!-- Dark card skeleton -->
      <div style="background:#0F172A;border-radius:16px;padding:22px;margin-bottom:28px">
        <div style="background:rgba(255,255,255,0.08);width:90px;height:12px;border-radius:4px;margin-bottom:12px"></div>
        <div style="background:rgba(255,255,255,0.1);width:180px;height:24px;border-radius:6px;margin-bottom:12px"></div>
        <div style="background:rgba(255,255,255,0.06);width:150px;height:14px;border-radius:4px;margin-bottom:20px"></div>
        <div style="background:#257BF4;opacity:0.5;height:48px;border-radius:12px"></div>
      </div>
      <!-- List items skeleton -->
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px">
        <div style="width:4px;height:24px;border-radius:99px;background:#257BF4;opacity:0.3"></div>
        <div class="sk" style="width:150px;height:20px;border-radius:6px"></div>
      </div>
      <div class="sk-card" style="flex-direction:row;align-items:center;gap:14px;padding:14px 18px;margin-bottom:10px">
        <div class="sk" style="width:44px;height:44px;border-radius:50%;flex-shrink:0"></div>
        <div style="flex:1">
          <div class="sk" style="width:120px;height:14px;border-radius:4px;margin-bottom:6px"></div>
          <div class="sk" style="width:160px;height:11px;border-radius:4px"></div>
        </div>
        <div style="text-align:right">
          <div class="sk" style="width:60px;height:14px;border-radius:4px;margin-bottom:6px"></div>
          <div class="sk" style="width:40px;height:10px;border-radius:4px"></div>
        </div>
      </div>
      <div class="sk-card" style="flex-direction:row;align-items:center;gap:14px;padding:14px 18px">
        <div class="sk" style="width:44px;height:44px;border-radius:50%;flex-shrink:0"></div>
        <div style="flex:1">
          <div class="sk" style="width:100px;height:14px;border-radius:4px;margin-bottom:6px"></div>
          <div class="sk" style="width:140px;height:11px;border-radius:4px"></div>
        </div>
        <div style="text-align:right">
          <div class="sk" style="width:55px;height:14px;border-radius:4px;margin-bottom:6px"></div>
          <div class="sk" style="width:40px;height:10px;border-radius:4px"></div>
        </div>
      </div>
    </div>
    <!-- Bottom nav skeleton -->
    <div style="border-top:1px solid #E2E8F0;padding:10px 0 16px;display:flex;justify-content:space-around;max-width:600px;width:100%;margin:0 auto">
      <div style="text-align:center"><div class="sk" style="width:24px;height:24px;border-radius:6px;margin:0 auto 4px"></div><div class="sk" style="width:44px;height:8px;border-radius:3px;margin:0 auto"></div></div>
      <div style="text-align:center"><div class="sk" style="width:24px;height:24px;border-radius:6px;margin:0 auto 4px"></div><div class="sk" style="width:44px;height:8px;border-radius:3px;margin:0 auto"></div></div>
      <div style="text-align:center"><div class="sk" style="width:24px;height:24px;border-radius:6px;margin:0 auto 4px"></div><div class="sk" style="width:44px;height:8px;border-radius:3px;margin:0 auto"></div></div>
      <div style="text-align:center"><div class="sk" style="width:24px;height:24px;border-radius:6px;margin:0 auto 4px"></div><div class="sk" style="width:44px;height:8px;border-radius:3px;margin:0 auto"></div></div>
    </div>
  </div>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{overscroll-behavior:none}
    .sk{background:#E2E8F0;animation:shimmer 1.5s infinite}
    .sk-card{background:#fff;border:1px solid #E2E8F0;border-radius:16px;padding:16px;display:flex;flex-direction:column}
    @keyframes shimmer{0%,100%{opacity:1}50%{opacity:0.4}}
  </style>
  <script src="flutter_bootstrap.js" async=""></script>
  <script>
    window.addEventListener('flutter-first-frame', function() {
      var loader = document.getElementById('loading');
      if (loader) loader.remove();
    });

    // Force update: when a new service worker is available, activate it immediately
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.addEventListener('controllerchange', function() {
        window.location.reload();
      });
    }
  </script>


</body></html>
