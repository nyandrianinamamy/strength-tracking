name: PR Checks

on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Unit tests
        run: flutter test

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Install ChromeDriver
        uses: nanasess/setup-chromedriver@v2

      - name: Run E2E tests
        timeout-minutes: 10
        run: |
          # Start emulators in background
          firebase emulators:start --only auth,firestore --project myappv4 &
          for i in $(seq 1 30); do
            if curl -s http://localhost:9099 > /dev/null 2>&1 && \
               curl -s http://localhost:8081 > /dev/null 2>&1; then
              echo "Emulators ready"
              break
            fi
            echo "Waiting for emulators... ($i/30)"
            sleep 2
          done

          chromedriver --port=4444 &

          xvfb-run flutter drive \
            --driver=test_driver/integration_test.dart \
            --target=integration_test/app_test.dart \
            -d chrome \
            --browser-name=chrome

          # Kill all background jobs so the step exits cleanly
          kill $(jobs -p) 2>/dev/null
          wait 2>/dev/null || true
