name: iOS and Watch checks

on:
  workflow_call:
    inputs:
      source_ref:
        description: Exact source commit to verify
        type: string
        required: true
      run_ipad:
        description: Include the iPad compatibility UI suite
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
      - name: Select release Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
      - name: Cache CocoaPods dependencies
        uses: actions/cache@v5
        with:
          path: |
            ios/Pods
            ~/Library/Caches/CocoaPods
            ~/.cocoapods/repos
          key: pods-${{ runner.os }}-${{ runner.arch }}-xcode26.3-flutter3.41.9-${{ hashFiles('ios/Podfile', 'ios/Podfile.lock', 'pubspec.lock') }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.9
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install Firebase emulator tools
        run: npm install -g firebase-tools@15.10.1
      - name: Install simulator UI automation
        run: npm install --prefix build/ci-tools xcodebuildmcp@2.7.0
      - name: Install dependencies
        run: |
          flutter pub get --enforce-lockfile
          (cd packages/training_engine && dart pub get --enforce-lockfile)
          (cd packages/flutter_body_heatmap && flutter pub get)
      - name: Analyze and test app
        run: |
          flutter analyze --no-fatal-infos
          flutter test
      - name: Test packages
        run: |
          (cd packages/training_engine && dart test)
          (cd packages/flutter_body_heatmap && flutter test)
      - name: Test native lifecycle rules
        run: bash tool/ci/run_native_regressions.sh
      - name: Test simulator UI helper
        run: python3 -m unittest discover -s tool/ci/tests -v
      - name: Verify static legal site
        run: python3 tool/ci/verify_static_site.py
      - name: Run iPad UI scenarios
        if: inputs.run_ipad
        timeout-minutes: 25
        env:
          IOS_E2E_DEVICE_TYPE: com.apple.CoreSimulator.SimDeviceType.iPad-Pro-11-inch-4th-generation-8GB
          IOS_E2E_OUTPUT_DIR: ${{ github.workspace }}/build/ios-e2e-ipad
        run: bash tool/ci/run_ios_e2e.sh --ui-only
      - name: Run iOS and paired Watch scenarios
        timeout-minutes: 45
        env:
          AXE_PATH: ${{ github.workspace }}/build/ci-tools/node_modules/xcodebuildmcp/bundled/axe
        run: bash tool/ci/run_ios_e2e.sh --with-auth --paired-watch
      - name: Verify test configuration restored
        if: always()
        run: git diff --exit-code -- ios/Runner/GoogleService-Info.plist
      - name: Save verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-watch-verification-${{ inputs.source_ref }}
          path: |
            build/ios-e2e/
            build/ios-e2e-ipad/
            packages/flutter_body_heatmap/test/failures/
          if-no-files-found: warn
