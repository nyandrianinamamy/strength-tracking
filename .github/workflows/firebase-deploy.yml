name: Deploy static legal and support pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'firebase.json'
      - 'tool/ci/verify_static_site.py'
      - '.github/workflows/firebase-deploy.yml'

permissions:
  contents: read
  checks: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify legal and support pages
        run: python3 tool/ci/verify_static_site.py
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: myappv4
