name: Build iOS IPA

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-ipa:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter dependencies
        run: flutter pub get

      - name: Install CocoaPods dependencies
        run: cd ios && pod install

      - name: Build unsigned iOS app
        run: flutter build ios --release --no-codesign

      - name: Package IPA
        run: |
          mkdir -p build/Payload
          cp -r build/ios/iphoneos/Runner.app build/Payload/
          cd build
          zip -r -9 StrengthApp.ipa Payload

      - name: Extract version from tag
        id: version
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Get IPA size
        id: ipa
        run: echo "size=$(stat -f%z build/StrengthApp.ipa)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.version.outputs.tag }}
          files: build/StrengthApp.ipa
          generate_release_notes: true

      - name: Update SideStore source JSON
        env:
          TAG: ${{ steps.version.outputs.tag }}
          IPA_SIZE: ${{ steps.ipa.outputs.size }}
        run: |
          export DATE=$(date -u +"%Y-%m-%d")
          export DOWNLOAD_URL="https://github.com/nyandrianinamamy/strength-tracking/releases/download/${TAG}/StrengthApp.ipa"

          # Use python3 (available on macOS runners) to update the JSON
          python3 - <<'PYEOF'
          import json, os

          tag = os.environ["TAG"]
          version = tag.lstrip("v")
          date = os.environ["DATE"]
          size = int(os.environ["IPA_SIZE"])
          download_url = os.environ["DOWNLOAD_URL"]

          with open("sidestore-source.json", "r") as f:
              source = json.load(f)

          new_version = {
              "version": version,
              "date": date,
              "downloadURL": download_url,
              "size": size,
              "localizedDescription": f"Release {tag}"
          }

          # Prepend new version (newest first), remove duplicate if same version exists
          versions = source["apps"][0]["versions"]
          versions = [v for v in versions if v["version"] != version]
          versions.insert(0, new_version)
          source["apps"][0]["versions"] = versions

          with open("sidestore-source.json", "w") as f:
              json.dump(source, f, indent=2)
              f.write("\n")
          PYEOF

      - name: Commit updated source JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          git add sidestore-source.json
          git commit -m "chore: update SideStore source for ${{ steps.version.outputs.tag }}"
          git push origin main
