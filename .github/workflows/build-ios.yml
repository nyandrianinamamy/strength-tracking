name: Build iOS

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to build and upload"
        required: true
        default: "v1.0.31+317"
      quality_only:
        description: "Run checks on the selected ref without signing or uploading"
        type: boolean
        default: false
      run_native_e2e:
        description: "Opt in to experimental iOS and paired Watch simulator checks"
        type: boolean
        default: false
      run_ipad:
        description: "Include iPad compatibility checks before upload"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}
      - id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  quality:
    needs: source
    uses: ./.github/workflows/ios-quality.yml
    with:
      source_ref: ${{ needs.source.outputs.sha }}
      run_native_e2e: ${{ github.event_name == 'workflow_dispatch' && inputs.run_native_e2e || false }}
      run_ipad: ${{ github.event_name == 'workflow_dispatch' && inputs.run_ipad || false }}

  # ─── TestFlight upload via Fastlane ───
  build-testflight:
    needs: [source, quality]
    if: github.event_name != 'workflow_dispatch' || !inputs.quality_only
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.sha }}

      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer

      - name: Restore verified CocoaPods dependencies
        uses: actions/cache/restore@v5
        with:
          path: |
            ios/Pods
            ~/Library/Caches/CocoaPods
            ~/.cocoapods/repos
          key: pods-${{ runner.os }}-${{ runner.arch }}-xcode26.3-flutter3.41.9-${{ hashFiles('ios/Podfile', 'ios/Podfile.lock', 'pubspec.lock') }}

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.9

      - name: Flutter dependencies
        run: flutter pub get

      - name: Verify release tag matches source version
        env:
          RELEASE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}
        run: |
          python3 - <<'PYTAG'
          import os, pathlib, re
          source = pathlib.Path('pubspec.yaml').read_text()
          version = re.search(r'^version:\s*(\S+)', source, re.MULTILINE).group(1)
          tag = os.environ['RELEASE_REF'].removeprefix('refs/tags/')
          if tag != 'v' + version:
              raise SystemExit(f'Release tag {tag} does not match source version v{version}')
          PYTAG

      - name: Install CocoaPods dependencies
        run: cd ios && pod install

      - name: Setup Ruby and Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: ios

      - name: Setup SSH for match
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.MATCH_DEPLOY_KEY }}

      - name: Verify match repo access
        env:
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          echo "MATCH_GIT_URL=${MATCH_GIT_URL}"
          git ls-remote "${MATCH_GIT_URL}"

      - name: Extract version from tag
        id: version
        env:
          RELEASE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}
        run: |
          TAG="${RELEASE_REF#refs/tags/}"
          TAG="${TAG#v}"
          VERSION="${TAG%%+*}"
          BUILD="${TAG#*+}"
          if [[ "$BUILD" == "$TAG" ]]; then
            BUILD=""
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "build=${BUILD}" >> "$GITHUB_OUTPUT"

      - name: Build and upload to TestFlight
        working-directory: ios
        env:
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          BUILD_VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ steps.version.outputs.build }}
        run: bundle exec fastlane beta
