name: Build iOS IPA

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-ipa:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter dependencies
        run: flutter pub get

      - name: Install CocoaPods dependencies
        run: cd ios && pod install

      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "number=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Build unsigned iOS app
        run: flutter build ios --release --no-codesign --build-name=${{ steps.version.outputs.number }}

      - name: Package IPA
        run: |
          rm -rf build/Payload build/StrengthApp.ipa
          mkdir -p build/Payload

          # Preserve the app bundle exactly as built. `ditto` is safer than
          # `cp`/`zip` for Apple bundles and embedded frameworks.
          ditto build/ios/iphoneos/Runner.app build/Payload/Runner.app

          # SideStore will re-sign the app, so remove any stale signature and
          # provisioning artifacts before creating the archive.
          find build/Payload -name "_CodeSignature" -type d -prune -exec rm -rf {} +
          find build/Payload -name "embedded.mobileprovision" -type f -delete

          # Clear extended attributes to avoid packaging macOS metadata.
          xattr -cr build/Payload || true

          # Create a standard IPA zip while preserving bundle structure.
          ditto -c -k --sequesterRsrc --keepParent build/Payload build/StrengthApp.ipa

      - name: Validate IPA contents
        run: |
          zipinfo -1 build/StrengthApp.ipa | sed -n '1,80p'
          python3 - <<'PYEOF'
          import sys
          import zipfile

          with zipfile.ZipFile("build/StrengthApp.ipa") as zf:
              names = zf.namelist()

          def has_entry(path: str) -> bool:
              return path in names or any(name.startswith(path) for name in names)

          required_entries = [
              "Payload/",
              "Payload/Runner.app/",
              "Payload/Runner.app/Info.plist",
              "Payload/Runner.app/Runner",
          ]

          missing = [name for name in required_entries if not has_entry(name)]
          if missing:
              print("Missing expected IPA entries:", missing, file=sys.stderr)
              sys.exit(1)
          PYEOF

      - name: Get IPA size
        id: ipa
        run: echo "size=$(stat -f%z build/StrengthApp.ipa)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.version.outputs.tag }}
          files: build/StrengthApp.ipa
          generate_release_notes: true

      - name: Update SideStore source JSON
        env:
          TAG: ${{ steps.version.outputs.tag }}
          IPA_SIZE: ${{ steps.ipa.outputs.size }}
        run: |
          export DATE=$(date -u +"%Y-%m-%d")
          export DOWNLOAD_URL="https://github.com/nyandrianinamamy/strength-tracking/releases/download/${TAG}/StrengthApp.ipa"

          # Use python3 (available on macOS runners) to update the JSON
          python3 - <<'PYEOF'
          import json, os

          tag = os.environ["TAG"]
          version = tag.lstrip("v")
          date = os.environ["DATE"]
          size = int(os.environ["IPA_SIZE"])
          download_url = os.environ["DOWNLOAD_URL"]

          with open("sidestore-source.json", "r") as f:
              source = json.load(f)

          new_version = {
              "version": version,
              "date": date,
              "downloadURL": download_url,
              "size": size,
              "localizedDescription": f"Release {tag}"
          }

          # Prepend new version (newest first), remove duplicate if same version exists
          versions = source["apps"][0]["versions"]
          versions = [v for v in versions if v["version"] != version]
          versions.insert(0, new_version)
          source["apps"][0]["versions"] = versions

          with open("sidestore-source.json", "w") as f:
              json.dump(source, f, indent=2)
              f.write("\n")
          PYEOF

      - name: Commit updated source JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          git add sidestore-source.json
          git commit -m "chore: update SideStore source for ${{ steps.version.outputs.tag }}"
          git push origin main
